<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ONE LIFE OS</title>
<meta name="description" content="Personal growth, performance and life management.">
<meta name="theme-color" content="#16233F" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1424" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="One Life">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
/* Layout: single column phone canvas (max 560px), sticky header, fixed 5-tab bar, bottom sheets for every edit. */
:root{
  --navy:#16233F; --navy-2:#22345A; --gold:#A8874E; --gold-soft:#E9DEC8;
  --bg:#F8F5EF; --surface:#FFFFFF; --surface-2:#F1ECE3; --line:#E3DCCF;
  --ink:#24262B; --ink-2:#5B5F68; --ink-3:#8A8E96;
  --ok:#3E7D5A; --warn:#B07A2A; --bad:#A6473F; --on-accent:#FFFFFF;
  --p-faith:#A8874E; --p-pro:#3B5D93; --p-biz:#2F7A72; --p-comms:#7A5A92; --p-health:#5E8A4E; --p-skills:#B5654A;
  --heat-0:#ECE6DA; --heat-1:#D9C9A6; --heat-2:#C3A66E; --heat-3:#9C7B3F; --heat-rest:#D7DEE8;
  --shadow:0 1px 2px rgba(22,35,63,.06),0 4px 14px rgba(22,35,63,.06);
  --serif: ui-serif,"New York","Iowan Old Style",Georgia,"Times New Roman",serif;
  --sans: -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono: ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:16px; --r-sm:10px;
  --tabbar-h:64px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --navy:#C9D4EA; --navy-2:#9FB0D2; --gold:#CDAE72; --gold-soft:#3A3322;
  --bg:#0E1424; --surface:#161F35; --surface-2:#1D2842; --line:#2A3654;
  --ink:#ECE8E0; --ink-2:#B3B6BF; --ink-3:#848A99; --on-accent:#0E1424;
  --ok:#6DBF8E; --warn:#E0A852; --bad:#E07B70;
  --p-faith:#CDAE72; --p-pro:#7FA3E0; --p-biz:#5FB8AC; --p-comms:#B497D0; --p-health:#8FC07C; --p-skills:#E39478;
  --heat-0:#1F2A44; --heat-1:#4A4430; --heat-2:#80693A; --heat-3:#CDAE72; --heat-rest:#2B3A5C;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --navy:#C9D4EA; --navy-2:#9FB0D2; --gold:#CDAE72; --gold-soft:#3A3322;
  --bg:#0E1424; --surface:#161F35; --surface-2:#1D2842; --line:#2A3654;
  --ink:#ECE8E0; --ink-2:#B3B6BF; --ink-3:#848A99; --on-accent:#0E1424;
  --ok:#6DBF8E; --warn:#E0A852; --bad:#E07B70;
  --p-faith:#CDAE72; --p-pro:#7FA3E0; --p-biz:#5FB8AC; --p-comms:#B497D0; --p-health:#8FC07C; --p-skills:#E39478;
  --heat-0:#1F2A44; --heat-1:#4A4430; --heat-2:#80693A; --heat-3:#CDAE72; --heat-rest:#2B3A5C;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
body{min-height:100vh;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:-.01em;margin:0;text-wrap:balance;color:var(--navy)}
h1{font-size:1.75rem;line-height:1.15}
h2{font-size:1.25rem}
h3{font-size:1.05rem}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.faint{color:var(--ink-3)}
.small{font-size:.85rem}
.tiny{font-size:.75rem}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600}

#app{max-width:560px;margin:0 auto;padding:0 16px calc(var(--tabbar-h) + env(safe-area-inset-bottom,0px) + 32px);min-height:100vh}
.topbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 10px) 0 10px;display:flex;align-items:center;gap:12px;justify-content:space-between}
.topbar .title{font-family:var(--serif);font-size:1.15rem;font-weight:600;color:var(--navy)}
.save-dot{font-size:.72rem;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.save-dot i{width:6px;height:6px;border-radius:50%;background:var(--ok);display:inline-block}
.save-dot.pending i{background:var(--warn)}

.stack{display:flex;flex-direction:column;gap:14px}
.stack-sm{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.section{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.card.tight{padding:12px}
.card.gold{border-color:var(--gold);background:linear-gradient(0deg,var(--surface),var(--surface)) padding-box}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.list>*+*{border-top:1px solid var(--line)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:.95rem;color:var(--navy)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:var(--bg)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--on-accent)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--bad)}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:6px 12px;font-size:.85rem;border-radius:10px}
.btn:disabled{opacity:.5}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;color:var(--navy);flex:none}
.icon-btn svg,.btn svg{width:20px;height:20px}
.link{background:none;border:0;padding:6px 0;color:var(--gold);font-weight:600;font-size:.9rem;min-height:36px}

/* Chips */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:36px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:.88rem;font-weight:500;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--bg)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:.7rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.badge.ess{background:var(--gold-soft);color:var(--gold)}
.badge.ok{color:var(--ok)} .badge.warn{color:var(--warn)} .badge.bad{color:var(--bad)}
.badge.fact{background:transparent;border:1px solid var(--line)}
.badge.self{background:transparent;border:1px dashed var(--ink-3)}
.badge.ai{background:transparent;border:1px dotted var(--gold);color:var(--gold)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}

/* Task rows */
.task{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:60px;background:var(--surface)}
.task .tbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;background:none;border:0;text-align:left;padding:0}
.task .ttl{font-weight:500;overflow-wrap:anywhere}
.task .meta{font-size:.78rem;color:var(--ink-3);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.task.done .ttl{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--ink-3)}
.task.skipped .ttl{color:var(--ink-3);font-style:italic}
.check{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);background:transparent;flex:none;display:flex;align-items:center;justify-content:center;padding:0;position:relative}
.check::before{content:"";position:absolute;inset:-8px}
.check svg{width:18px;height:18px;opacity:0;color:var(--on-accent)}
.done .check{background:var(--ok);border-color:var(--ok)}
.done .check svg{opacity:1}
.skipped .check{border-style:dashed}
.prio-num{font-family:var(--serif);font-size:1.3rem;color:var(--gold);width:20px;text-align:center;flex:none}

/* Today header */
.hero{display:flex;gap:16px;align-items:center;margin-top:4px}
.ring{flex:none;position:relative;width:84px;height:84px}
.ring svg{width:84px;height:84px;transform:rotate(-90deg)}
.ring .lbl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.ring .lbl b{font-size:1.2rem;color:var(--navy)}
.ring .lbl span{font-size:.65rem;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase}
.focus{font-family:var(--serif);font-style:italic;color:var(--ink-2);font-size:1rem}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;min-height:38px;border:0;border-radius:9px;background:transparent;font-size:.85rem;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--navy);box-shadow:var(--shadow)}

/* Timeline */
.tl{position:relative;padding-left:62px}
.tl-item{position:relative;padding:6px 0}
.tl-time{position:absolute;left:-62px;top:12px;width:52px;text-align:right;font-size:.78rem;color:var(--ink-3);font-variant-numeric:tabular-nums}
.tl-block{border-radius:12px;padding:10px 12px;background:var(--surface-2);border-left:3px solid var(--ink-3);font-size:.9rem}
.tl-block.fixed{background:repeating-linear-gradient(135deg,var(--surface-2),var(--surface-2) 8px,var(--bg) 8px,var(--bg) 16px)}

/* Forms */
label.f{display:flex;flex-direction:column;gap:6px;font-size:.85rem;color:var(--ink-2);font-weight:500}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=password],input[type=url],select,textarea{width:100%;min-height:46px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:16px;color:var(--ink)}
textarea{min-height:88px;resize:vertical;line-height:1.45}
input[type=range]{width:100%;accent-color:var(--gold);height:32px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px}
.switch{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:999px;background:var(--line);position:relative;flex:none;border:0;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch:checked{background:var(--ok)}
.switch:checked::after{transform:translateX(20px)}
.mic-wrap{position:relative}
.mic-wrap textarea{padding-right:52px}
.mic{position:absolute;right:6px;top:6px;width:40px;height:40px;border-radius:10px;border:0;background:var(--surface-2);color:var(--ink-2);display:flex;align-items:center;justify-content:center}
.mic.on{background:var(--bad);color:#fff}
.mic svg{width:18px;height:18px}
.scale{display:flex;gap:6px}
.scale button{flex:1;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;color:var(--ink-2)}
.scale button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--on-accent)}

/* Progress bars */
.bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--gold)}
.goal-card{display:flex;flex-direction:column;gap:8px;padding:14px;background:var(--surface);border:0;text-align:left;width:100%}

/* Tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tabbar-h)}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.68rem;font-weight:600;color:var(--ink-3);letter-spacing:.02em}
.tabbar button svg{width:24px;height:24px}
.tabbar button[aria-current="page"]{color:var(--navy)}
.tabbar button[aria-current="page"] svg{color:var(--gold)}
.fab{position:fixed;right:max(16px,calc(50vw - 264px));bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom,0px) + 16px);z-index:9;width:56px;height:56px;border-radius:18px;border:0;background:var(--navy);color:var(--bg);box-shadow:0 6px 20px rgba(22,35,63,.28);display:flex;align-items:center;justify-content:center}
.fab svg{width:26px;height:26px}

/* Sheet */
.scrim{position:fixed;inset:0;z-index:30;background:rgba(10,14,25,.45);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:8px 16px calc(24px + env(safe-area-inset-bottom,0px));animation:up .22s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom,0px) + 84px);z-index:40;background:var(--navy);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.9rem;font-weight:500;box-shadow:var(--shadow);max-width:calc(100vw - 32px);display:flex;gap:12px;align-items:center}
.toast button{background:none;border:0;color:var(--gold-soft);font-weight:700;padding:4px}

/* Empty state */
.empty{padding:22px 16px;text-align:center;color:var(--ink-3);font-size:.9rem;display:flex;flex-direction:column;align-items:center;gap:6px}
.empty b{color:var(--ink-2);font-weight:600}

/* Charts */
.chart-card{display:flex;flex-direction:column;gap:10px}
.chart-card .what{font-size:.8rem;color:var(--ink-3)}
.chart-wrap{overflow-x:auto}
.chart svg{display:block;width:100%;height:auto}
.chart text{fill:var(--ink-3);font-size:10px;font-family:var(--sans)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.78rem;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.kpi b{display:block;font-family:var(--serif);font-size:1.4rem;color:var(--navy);font-variant-numeric:tabular-nums}
.kpi span{font-size:.72rem;color:var(--ink-3)}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px}
.heat i{width:12px;height:12px;border-radius:3px;background:var(--heat-0);display:block}

/* Menu list */
.menu-item{display:flex;align-items:center;gap:14px;padding:14px;min-height:60px;background:var(--surface);border:0;width:100%;text-align:left}
.menu-item .mi-ic{width:36px;height:36px;border-radius:10px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--gold);flex:none}
.menu-item .mi-ic svg{width:20px;height:20px}
.menu-item .chev{color:var(--ink-3);width:18px;height:18px}

/* Lock & onboarding */
.lock{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px}
.pin-dots{display:flex;gap:14px}
.pin-dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--navy);display:block}
.pin-dots i.f{background:var(--navy)}
.keypad{display:grid;grid-template-columns:repeat(3,72px);gap:14px}
.keypad button{width:72px;height:72px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:1.5rem;font-weight:500;color:var(--navy)}
.ob{padding-top:calc(env(safe-area-inset-top,0px) + 28px)}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--gold)}
.wordmark{font-family:var(--serif);letter-spacing:.18em;text-transform:uppercase;font-size:.8rem;color:var(--gold);font-weight:600}
.callout{border:1px dashed var(--line);border-radius:12px;padding:12px;font-size:.85rem;color:var(--ink-2)}
.pre{font-family:var(--mono);font-size:.78rem;white-space:pre-wrap;overflow-wrap:anywhere}
hr.sep{border:0;border-top:1px solid var(--line);margin:4px 0}
details summary{cursor:pointer;min-height:40px;display:flex;align-items:center;font-weight:600;color:var(--navy)}

</style>
</head>

<noscript>ONE LIFE OS needs JavaScript.</noscript>
<script>
'use strict';
/* ===================== Utilities ===================== */
const APP_VERSION = '1.0.0';
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = (p = '') => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad = n => String(n).padStart(2, '0');
const ds = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const pd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const today = () => ds(new Date());
const addDays = (s, n) => { const d = pd(s); d.setDate(d.getDate() + n); return ds(d); };
const addMonths = (s, n) => { const d = pd(s); const day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + n); const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); d.setDate(Math.min(day, last)); return ds(d); };
const dow = s => pd(s).getDay(); // 0 Sun
const weekStart = s => addDays(s, -((dow(s) + 6) % 7)); // Monday
const monthKey = s => s.slice(0, 7);
const daysBetween = (a, b) => Math.round((pd(b) - pd(a)) / 864e5);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const DOWL = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const MONL = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const fmtDate = (s, o = {}) => { const d = pd(s); return `${o.dow ? DOW[d.getDay()] + ' ' : ''}${d.getDate()} ${MON[d.getMonth()]}${o.year ? ' ' + d.getFullYear() : ''}`; };
const fmtLong = s => { const d = pd(s); return `${DOWL[d.getDay()]} ${d.getDate()} ${MONL[d.getMonth()]}`; };
const fmtMonth = k => { const [y, m] = k.split('-').map(Number); return `${MONL[m - 1]} ${y}`; };
const toMin = t => { if (!t) return null; const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const fromMin = m => `${pad(Math.floor(((m % 1440) + 1440) % 1440 / 60))}:${pad(((m % 60) + 60) % 60)}`;

/* ===================== Persistent store (IndexedDB) ===================== */
const COLLECTIONS = ['settings', 'goals', 'milestones', 'routines', 'tasks', 'days', 'journal', 'competencies', 'projects', 'finance', 'logs', 'reviews', 'events', 'sync'];
const S = {}; // in-memory state, one entry per collection
const IDB = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      if (!('indexedDB' in window)) return rej(new Error('IndexedDB unavailable'));
      const r = indexedDB.open('one-life-os', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => { this.db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  get(k) { return new Promise((res, rej) => { const t = this.db.transaction('kv').objectStore('kv').get(k); t.onsuccess = () => res(t.result); t.onerror = () => rej(t.error); }); },
  put(k, v) { return new Promise((res, rej) => { const tx = this.db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); },
};
let memoryOnly = false;
const dirty = new Set();
let saveTimer = null;
function defaults(k) {
  return ({ settings: {}, days: {}, journal: {}, finance: { targets: [], entries: [] }, sync: { map: {}, deleted: [] } })[k] ?? [];
}
async function loadAll() {
  try { await IDB.open(); } catch (e) { memoryOnly = true; }
  for (const k of COLLECTIONS) {
    let v = null;
    if (!memoryOnly) { try { v = await IDB.get(k); } catch (e) { v = null; } }
    S[k] = v ?? defaults(k);
  }
}
function save(...keys) {
  keys.forEach(k => dirty.add(k));
  setSaveDot(true);
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 250);
}
async function flush() {
  const keys = [...dirty]; dirty.clear();
  if (memoryOnly) { setSaveDot(false, 'Not saved — storage blocked'); return; }
  try {
    for (const k of keys) await IDB.put(k, JSON.parse(JSON.stringify(S[k])));
    setSaveDot(false);
  } catch (e) { keys.forEach(k => dirty.add(k)); setSaveDot(false, 'Save failed — retrying'); setTimeout(flush, 2000); }
}
window.addEventListener('pagehide', () => { if (dirty.size) flush(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && dirty.size) flush(); });
function setSaveDot(pending, msg) {
  const el = $('#saveDot'); if (!el) return;
  el.classList.toggle('pending', !!pending);
  el.querySelector('span').textContent = msg || (pending ? 'Saving' : 'Saved');
}

/* ===================== Year cycle & quarters ===================== */
const PHASES = [
  { q: 1, name: 'Foundations and consistency' },
  { q: 2, name: 'Professional development and validated business launch activity' },
  { q: 3, name: 'Execution, measurable progress and financial capacity' },
  { q: 4, name: 'Consolidation, evaluation and preparation for future scaling' },
];
const yearStart = () => S.settings.yearStart || '2026-10-14';
function cycleFor(date) { // returns {start, end, label, n}
  const base = yearStart();
  let n = 0; let start = base;
  if (date < base) { while (date < start) { n--; start = addMonths(base, 12 * n); } }
  else { while (addMonths(base, 12 * (n + 1)) <= date) n++; start = addMonths(base, 12 * n); }
  const end = addDays(addMonths(start, 12), -1);
  return { start, end, n, label: `${pd(start).getFullYear()}–${String(pd(end).getFullYear()).slice(2)}` };
}
function quarterOf(date) {
  const c = cycleFor(date);
  for (let q = 1; q <= 4; q++) {
    const s = addMonths(c.start, (q - 1) * 3), e = addDays(addMonths(c.start, q * 3), -1);
    if (date >= s && date <= e) return { q, start: s, end: e, cycle: c, phase: PHASES[q - 1].name };
  }
  return { q: 4, start: c.start, end: c.end, cycle: c, phase: PHASES[3].name };
}
function quarterRange(cycleStart, q) { return { start: addMonths(cycleStart, (q - 1) * 3), end: addDays(addMonths(cycleStart, q * 3), -1) }; }

function phaseLabel(date) {
  if (date < yearStart()) return `Year one starts ${fmtDate(yearStart(), { dow: true })} · Q1 ${PHASES[0].name}`;
  const q = quarterOf(date); return `Q${q.q} · ${q.phase}`;
}

/* ===================== Rules-based daily planning engine ===================== */
function defaultWorkType(date) {
  const d = dow(date);
  if (d === 0 || d === 6) return 'off';
  return (S.settings.officeDays || []).includes(d) ? 'office' : 'remote';
}
function getDay(date, create = true) {
  let day = S.days[date];
  if (!day && create) { day = S.days[date] = { date, mode: 'normal', workType: defaultWorkType(date), priorities: null, focus: '', checkin: null }; save('days'); }
  return day || { date, mode: 'normal', workType: defaultWorkType(date), priorities: null, focus: '', checkin: null };
}
function routineApplies(r, date, day) {
  if (!r.active || !r.days.includes(dow(date))) return false;
  const wt = day.workType;
  if (r.when === 'office') return wt === 'office';
  if (r.when === 'remote') return wt === 'remote';
  if (r.when === 'workday') return wt === 'office' || wt === 'remote';
  return true;
}
/* Generate routine tasks once per date (only for today and future dates the user actually opens — never back-filled). */
function generateDay(date) {
  if (date < today()) return;
  const day = getDay(date);
  if (day.generated) return;
  for (const r of S.routines) {
    if (!routineApplies(r, date, day)) continue;
    if (S.tasks.some(t => t.routineId === r.id && t.date === date)) continue;

/* ===================== Goals cascade ===================== */
let goalView = 'year', goalPillar = 'all', goalCycle = null;
const statusBadge = s => { const [l, c] = GOAL_STATUS[s] || GOAL_STATUS.notstarted; return `<span class="badge ${c}">${l}</span>`; };
function cycleGoals(cs) { return S.goals.filter(g => (g.cycle || yearStart()) === cs); }
function currentCycleStart() { return goalCycle || cycleFor(today() < yearStart() ? yearStart() : today()).start; }

SCREENS.goals = () => {
  const cs = currentCycleStart(), cyc = cycleFor(cs);
  const refDate = today() < cs ? cs : (today() > cyc.end ? cyc.end : today());
  const q = quarterOf(refDate);
  const goals = cycleGoals(cs).filter(g => goalPillar === 'all' || g.pillar === goalPillar);
  const cycles = [...new Set([yearStart(), ...S.goals.map(g => g.cycle).filter(Boolean)])].sort();
  const yearMap = `<div class="card tight"><div class="row between"><span class="eyebrow">Year ${cyc.label} · ${fmtDate(cyc.start, { year: true })} – ${fmtDate(cyc.end, { year: true })}</span>${cycles.length > 1 ? `<select id="cycSel" data-onchange="cycSel" style="width:auto;min-height:34px;padding:4px 8px">${cycles.map(c => `<option value="${c}" ${c === cs ? 'selected' : ''}>${cycleFor(c).label}</option>`).join('')}</select>` : ''}</div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px">${PHASES.map(ph => { const r = quarterRange(cs, ph.q); const cur = refDate >= r.start && refDate <= r.end; return `<div style="padding:8px;border-radius:10px;background:${cur ? 'var(--navy)' : 'var(--surface-2)'};color:${cur ? 'var(--bg)' : 'var(--ink-2)'}"><b style="font-family:var(--serif)">Q${ph.q}</b><div class="tiny" style="opacity:.85">${fmtDate(r.start)}</div></div>`; }).join('')}</div>
    <p class="small muted" style="margin-top:8px">Now: <b>Q${q.q}</b> · ${esc(q.phase)}</p></div>`;
  const views = `<div class="seg">${[['year', 'Year'], ['quarter', 'Quarter'], ['month', 'Month'], ['week', 'Week']].map(([v, l]) => `<button data-a="goalView" data-v="${v}" aria-pressed="${goalView === v}">${l}</button>`).join('')}</div>`;
  const chips = `<div class="chips scroll"><button class="chip" data-a="goalPillar" data-p="all" aria-pressed="${goalPillar === 'all'}">All areas</button>${PILLARS.map(p => `<button class="chip" data-a="goalPillar" data-p="${p.id}" aria-pressed="${goalPillar === p.id}">${pillarDot(p.id)} ${esc(p.short)}</button>`).join('')}</div>`;
  let body = '';
  if (goalView === 'year') {
    body = goals.length ? PILLARS.filter(p => goals.some(g => g.pillar === p.id)).map(p => `<div class="stack-sm"><span class="eyebrow">${esc(p.name)}</span><div class="list">${goals.filter(g => g.pillar === p.id).map(goalCard).join('')}</div></div>`).join('')
      : `<div class="list">${empty('No goals here yet', 'Add an annual goal to start the cascade.')}</div>`;
    body += `<button class="btn block" data-a="newGoal">${ICON.plus} Add annual goal</button>`;
    if (today() >= quarterRange(cs, 4).start && !cycles.includes(addMonths(cs, 12))) body += `<button class="btn block gold" data-a="newCycle">Start ${cycleFor(addMonths(cs, 12)).label}: carry goals forward</button>`;
  } else if (goalView === 'quarter') {
    body = [1, 2, 3, 4].map(qq => { const r = quarterRange(cs, qq); const ms = S.milestones.filter(m => m.kind === 'quarter' && m.q === qq && goals.some(g => g.id === m.goalId));
      const done = ms.filter(m => m.done).length;
      return `<details ${qq === q.q ? 'open' : ''}><summary>Q${qq} · ${fmtDate(r.start)}–${fmtDate(r.end)} <span class="faint small num" style="margin-left:auto">${done}/${ms.length}</span></summary>
      <p class="small muted" style="margin-bottom:8px">${esc(PHASES[qq - 1].name)}</p><div class="list">${ms.length ? ms.map(m => msRow(m, true)).join('') : empty('No milestones', 'Add them from a goal.')}</div></details>`; }).join('');
  } else if (goalView === 'month') {
    const mk = monthKey(refDate);
    const months = Array.from({ length: 12 }, (_, i) => monthKey(addMonths(cs, i)));
    body = `<div class="chips scroll">${months.map(m => `<button class="chip" data-a="goalMonth" data-m="${m}" aria-pressed="${(R.goalMonth || mk) === m}">${MON[Number(m.slice(5)) - 1]} ${m.slice(2, 4)}</button>`).join('')}</div>`;
    const sel = R.goalMonth || mk;
    const ms = S.milestones.filter(m => m.kind === 'month' && m.period === sel && goals.some(g => g.id === m.goalId));
    body += `<h3>${fmtMonth(sel)} objectives</h3><div class="list">${ms.length ? ms.map(m => msRow(m, true)).join('') : empty('No objectives for this month', 'Open a goal and add a monthly objective. Keep it to one or two per goal.')}</div>`;
  } else {
    const wk = weekStart(today());
    const ts = S.tasks.filter(t => (t.weekStart === wk || (t.date && weekStart(t.date) === wk)) && (t.goalId || t.source === 'weekly') && (goalPillar === 'all' || t.pillar === goalPillar));
    body = `<h3>Week of ${fmtDate(wk)}</h3><p class="small muted">Weekly actions linked to goals. Schedule them onto a day, or leave them floating for the week.</p>
    <div class="list">${ts.length ? ts.map(t => `<div class="task ${t.status}"><button class="check" data-a="toggleTask" data-id="${t.id}" aria-label="Toggle">${ICON.check}</button><button class="tbody" data-a="openTask" data-id="${t.id}"><span class="ttl">${esc(t.title)}</span><span class="meta">${t.pillar ? pillarDot(t.pillar) : ''}${t.date ? fmtDate(t.date, { dow: true }) : 'Not scheduled'}${t.goalId && goalOf(t.goalId) ? ' · ' + esc(goalOf(t.goalId).title.slice(0, 30)) : ''}</span></button></div>`).join('') : empty('No weekly actions yet', 'Tap + and choose "This week", or add from a goal.')}</div>`;
  }
  return { title: 'Goals', html: `<div class="stack">${yearMap}${views}${chips}${body}</div>` };
};
function goalCard(g) {
  const p = goalProgress(g);
  const next = S.milestones.filter(m => m.goalId === g.id && !m.done).sort((a, b) => (a.due || '').localeCompare(b.due || ''))[0];
  return `<button class="goal-card" data-a="openGoal" data-id="${g.id}"><span class="row between"><span class="ttl" style="font-weight:600">${esc(g.title)}</span>${statusBadge(g.status)}</span>

  const byP = {}; PILLARS.forEach(p => byP[p.id] = { planned: 0, done: 0 });
  for (const d of dates) {
    const s = dayStats(d); planned += s.planned; done += s.done; skipped += s.skipped;
    if (S.days[d]?.mode === 'rest') restDays++;
    tasksFor(d).filter(t => t.status !== 'skipped').forEach(t => { if (byP[t.pillar]) { byP[t.pillar].planned++; if (t.status === 'done') byP[t.pillar].done++; } });
    if (s.done || hasJournal(S.journal[d]) || S.days[d]?.checkin) activeDays++;
  }
  const inR = x => x >= start && x <= end;
  const logs = S.logs.filter(l => inR(l.date));
  const lk = k => logs.filter(l => l.kind === k);
  const checkins = dates.map(d => S.days[d]?.checkin).filter(Boolean);
  const avg = k => { const v = checkins.map(c => c[k]).filter(x => x != null); return v.length ? Math.round(sum(v) / v.length * 10) / 10 : null; };
  const lightsOut = S.tasks.filter(t => inR(t.date || '') && t.anchor && /^Lights out/.test(t.title) && t.status !== 'skipped');
  return {
    days: dates.length, activeDays, restDays, planned, done, skipped, completion: pct(done, planned), byPillar: byP,
    workouts: lk('workout').length || S.tasks.filter(t => inR(t.date || '') && t.kind === 'workout' && t.status === 'done').length,
    workoutMins: sum(lk('workout').map(l => l.mins)), keyboardMins: sum(lk('keyboard').map(l => l.mins)), tradingMins: sum(lk('trading').map(l => l.mins)),
    drills: lk('comms').length, cpdHours: Math.round(sum(lk('cpd').map(l => l.mins)) / 6) / 10, cpdFormalHours: Math.round(sum(lk('cpd').filter(l => l.formal).map(l => l.mins)) / 6) / 10,
    journalDays: dates.filter(d => hasJournal(S.journal[d])).length,
    milestonesDone: S.milestones.filter(m => m.done && m.doneAt && inR(m.doneAt.slice(0, 10))).length,
    avgSleep: avg('sleep'), avgEnergy: avg('energy'), checkins: checkins.length,
    bedtime: lightsOut.length ? pct(lightsOut.filter(t => t.status === 'done').length, lightsOut.length) : null,
  };
}
function suggestions(f) {
  const out = [];
  if (!f.planned) return ['Not enough recorded activity yet to suggest anything. Keep logging and check back next week.'];
  PILLARS.forEach(p => { const b = f.byPillar[p.id]; if (p.id !== 'faith' && b.planned >= 3 && b.done / b.planned < 0.5) out.push(`${p.short}: ${b.done} of ${b.planned} planned items done. Consider planning fewer, fixed sessions next week rather than more.`); });
  if (f.skipped > f.planned * 0.3) out.push('Many items were skipped. The plan may be too full for this season. Try trimming optional growth items.');
  if (f.bedtime != null && f.bedtime < 60) out.push(`Bedtime kept on ${f.bedtime}% of nights. Moving the wind-down earlier by 15 minutes may help.`);
  if (f.avgSleep != null && f.avgSleep < 6.5) out.push(`Average sleep ${f.avgSleep}h. Protect sleep before adding anything new.`);
  if (f.completion != null && f.completion >= 85) out.push('Strong follow-through. You have room to add one stretch action next week if you want it.');
  if (!f.drills) out.push('No communication drills recorded. One 10-minute drill is enough to keep the habit alive.');

const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function deriveKey(pass, salt) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 210000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function encrypt(obj, pass) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await deriveKey(pass, salt), new TextEncoder().encode(JSON.stringify(obj)));
  return { v: 1, salt: b64(salt), iv: b64(iv), ct: b64(ct) };
}
async function decrypt(p, pass) {
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(p.iv) }, await deriveKey(pass, unb64(p.salt)), unb64(p.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function cloudBackup(silent) {
  if (!S.settings.backupPass) throw new Error('Set a backup passphrase first.');
  const payload = await encrypt(snapshot(), S.settings.backupPass);
  const r = await api('/api/backup', { method: 'PUT', body: JSON.stringify({ payload, meta: { at: nowIso(), version: APP_VERSION } }) });
  S.sync.lastBackup = r.at || nowIso(); S.sync.lastBackupError = null; save('sync');
  if (!silent) { toast('Encrypted backup saved'); render(); }
}

      const b = batches[bi];

  let cells = ''; let anyHeat = false;
  for (let d = hStart; d <= addDays(weekStart(today()), 6); d = addDays(d, 1)) {
    if (d > today() || d < firstUse()) { cells += `<i style="opacity:${d > today() ? 0 : .35}"></i>`; continue; }
    const st = dayStats(d), rest = S.days[d]?.mode === 'rest', j = hasJournal(S.journal[d]) ? 1 : 0; const score = st.done + j + (S.days[d]?.checkin ? 1 : 0); if (score) anyHeat = true;
    const lvl = rest ? 'rest' : score === 0 ? 0 : score <= 2 ? 1 : score <= 5 ? 2 : 3;
    cells += `<i style="background:var(--heat-${lvl})" title="${fmtDate(d, { dow: true })}: ${st.done} done${j ? ', journal' : ''}${rest ? ' (rest day)' : ''}"></i>`;
  }
  const c11 = `<div class="chart-wrap"><div class="heat">${cells}</div></div><div class="legend"><span><i class="dot" style="background:var(--heat-0);border-radius:2px"></i>None</span><span><i class="dot" style="background:var(--heat-1);border-radius:2px"></i>Light</span><span><i class="dot" style="background:var(--heat-3);border-radius:2px"></i>Full</span><span><i class="dot" style="background:var(--heat-rest);border-radius:2px"></i>Rest day</span></div>${anyHeat ? '' : '<p class="small faint">Your days fill in here as you use the app.</p>'}`;
  // 12 month compare
  const tm = monthKey(today()) + '-01', lm = addMonths(tm, -1);
  const a = facts(tm, addDays(addMonths(tm, 1), -1)), noPrev = addDays(tm, -1) < firstUse(), b = noPrev ? {} : facts(lm < firstUse() ? firstUse() : lm, addDays(tm, -1));
  const cmpRows = [['Completion', a.completion != null ? a.completion + '%' : '—', b.completion != null ? b.completion + '%' : '—'], ['Items done', a.done, b.done], ['Active days', a.activeDays, b.activeDays], ['Journal days', a.journalDays, b.journalDays], ['Workouts', a.workouts, b.workouts], ['Comms drills', a.drills, b.drills], ['CPD hours', a.cpdHours, b.cpdHours], ['Milestones', a.milestonesDone, b.milestonesDone]];
  const c12 = true ? `<div style="overflow-x:auto"><table class="small num" style="width:100%;border-collapse:collapse"><thead><tr><th style="text-align:left;padding:6px 0" class="faint">Measure</th><th style="text-align:right" class="faint">${MON[pd(tm).getMonth()]} (so far)</th><th style="text-align:right" class="faint">${MON[pd(lm).getMonth()]}</th></tr></thead><tbody>${cmpRows.map(r => `<tr style="border-top:1px solid var(--line)"><td style="padding:7px 0">${r[0]}</td><td style="text-align:right"><b>${r[1]}</b></td><td style="text-align:right">${noPrev ? '<span class="faint">—</span>' : r[2] ?? '—'}</td></tr>`).join('')}</tbody></table></div>` : noData('Available once you have used the app across two months.');

  const html = `<div class="stack">
    <div class="seg">${[[7, '7 days'], [30, '30 days'], [90, '90 days'], [365, '12 months']].map(([v, l]) => `<button data-a="range" data-v="${v}" aria-pressed="${range === v}">${l}</button>`).join('')}</div>
    <p class="tiny faint">Since ${fmtDate(start, { year: true })}. Only what you have recorded is shown. Rest days and items skipped on purpose are excluded from rates.</p>
    <div class="kpis"><div class="kpi"><b>${f.completion != null ? f.completion + '%' : '—'}</b><span>Completion</span></div><div class="kpi"><b>${f.activeDays}</b><span>Active days</span></div><div class="kpi"><b>${f.milestonesDone}</b><span>Milestones</span></div></div>
    ${chartCard('Completion rate', `Completed ÷ planned items per ${bucketWord}, excluding skips. “–” means nothing was planned.`, c1)}
    ${chartCard('Planned vs completed', `Number of items planned and completed per ${bucketWord}.`, c6)}
    ${chartCard('Daily engagement', 'Each square is a day. Darker means more completed items, check-ins and journal entries.', c11)}
    ${chartCard('By life area', 'Completed items in each area for this period (done / planned).', c3, 'Faith and marriage items count as kept rhythms, not as a measure of spiritual life.')}
    ${chartCard('Time allocation', 'Hours by area. Solid is recorded in activity logs, faded is estimated from completed tasks\' planned minutes.', c7)}
    ${chartCard('Monthly consistency', 'Share of non-rest days each month with at least one completed item, check-in or journal entry.', c2)}
    ${chartCard('Month comparison', 'This month so far against last month, from saved records.', c12)}
    ${chartCard('Quarterly milestones', 'Share of each quarter\'s milestones achieved, current year. Not affected by the date filter.', c4)}
    ${chartCard('Annual goal progress', 'From milestones and objectives achieved, or your own estimate where you chose self-assessed.', c5)}
    ${chartCard('Business projects', 'Project milestones completed in each workspace.', c10)}
    ${chartCard('Financial targets', 'Latest balance you entered against each target.', c8)}
    ${chartCard('Competency confidence', 'Your self-rated confidence (1–5) over time, for the six most recently updated competencies.', c9)}
    ${chartCard('Communication self-assessment', 'Weekly self-ratings (1–5) from your weekly reviews.', cC)}
  </div>`;
  return { title: 'Progress', html };
};
A.range = el => { range = Number(el.dataset.v); render(); };

/* ===================== PIN lock ===================== */
async function hashPin(pin, salt) { const d = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(salt + ':' + pin)); return b64(d); }
function showLock() {
  return new Promise(resolve => {
    let entry = '', fails = 0;
    const el = document.createElement('div'); el.className = 'lock'; el.id = 'lock';
    const draw = (msg = '') => { el.innerHTML = `<div class="wordmark">One Life OS</div><h2>Enter your PIN</h2><div class="pin-dots">${[0, 1, 2, 3].map(i => `<i class="${i < entry.length ? 'f' : ''}"></i>`).join('')}</div><p class="small" style="color:var(--bad);min-height:1.2em">${msg}</p>
      <div class="keypad">${[1, 2, 3, 4, 5, 6, 7, 8, 9, '', 0, '⌫'].map(k => k === '' ? '<span></span>' : `<button data-k="${k}" aria-label="${k === '⌫' ? 'Delete' : k}">${k}</button>`).join('')}</div>
      <p class="tiny faint" style="max-width:280px;text-align:center">Forgot it? Data stays locked on this device. You can reinstall and restore from a backup.</p>`; };
    draw(); document.body.appendChild(el);
    el.addEventListener('click', async e => {
      const b = e.target.closest('[data-k]'); if (!b) return; const k = b.dataset.k;
      if (k === '⌫') entry = entry.slice(0, -1); else if (entry.length < 4) entry += k;
      draw();
      if (entry.length === 4) {
        if (await hashPin(entry, S.settings.pinSalt) === S.settings.pinHash) { el.remove(); resolve(); }
        else { fails++; entry = ''; draw(fails >= 5 ? 'Too many attempts. Wait 30 seconds.' : 'Incorrect PIN'); if (fails >= 5) { el.style.pointerEvents = 'none'; setTimeout(() => { el.style.pointerEvents = ''; fails = 0; draw(); }, 30000); } }
      }
    });
  });
}
A.setPin = () => openSheet('Set a 4-digit PIN', `<input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" id="pin1" placeholder="New PIN"><input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" id="pin2" placeholder="Repeat PIN"><button class="btn primary block" data-a="savePin">Save PIN</button>`);
A.savePin = async () => {
  const a = val('pin1'), b = val('pin2'); if (!/^\d{4}$/.test(a)) return toast('Use exactly 4 digits'); if (a !== b) return toast('PINs do not match');
  S.settings.pinSalt = uid(); S.settings.pinHash = await hashPin(a, S.settings.pinSalt); save('settings'); closeSheet(); if ($('#view')) render(); toast('PIN set');
};
A.removePin = () => { delete S.settings.pinHash; delete S.settings.pinSalt; save('settings'); if ($('#view')) render(); toast('PIN removed'); };

/* ===================== Onboarding (under 5 minutes) ===================== */
const OB = { step: 0, o: { name: 'Paul', wifeName: '', officeDays: [2, 4], workStart: '09:00', workEnd: '17:00', commute: 45, wake: '06:00', bedtime: '22:30', bibleDay: 1, bibleTime: '19:30', churchTime: '10:00', dateNight: 5, yearStart: '2026-10-14' }, goals: STARTER_GOALS.filter(g => g.on).map(g => g.key) };
function obRead() {
  const o = OB.o; const g = id => document.getElementById(id);
  if (g('obName')) { o.name = g('obName').value; o.wifeName = g('obWife').value; }
  if (g('obWs')) { o.workStart = g('obWs').value; o.workEnd = g('obWe').value; o.commute = g('obCommute').value; o.officeDays = $$('#obOffice [aria-pressed="true"]').map(b => Number(b.dataset.d)); }
  if (g('obWake')) { o.wake = g('obWake').value; o.bedtime = g('obBed').value; o.bibleDay = g('obBibleDay').value; o.bibleTime = g('obBibleTime').value; o.churchTime = g('obChurch').value; o.dateNight = g('obDate').value; }
  if (g('obGoals')) OB.goals = $$('#obGoals input:checked').map(c => c.dataset.k);
}
function renderOnboarding() {
  const o = OB.o, s = OB.step;
  const daySel = (id, v, days = [0, 1, 2, 3, 4, 5, 6]) => `<select id="${id}">${days.map(d => `<option value="${d}" ${Number(v) === d ? 'selected' : ''}>${DOWL[d]}</option>`).join('')}</select>`;
  const steps = [
    `<h1>Welcome to ONE LIFE OS</h1><p class="muted">Vision to daily action, in one calm place. Setup takes about three minutes, and you can change everything later.</p>
     <label class="f">Your name<input type="text" id="obName" value="${esc(o.name)}"></label><label class="f">Your wife's name (optional, used for reminders)<input type="text" id="obWife" value="${esc(o.wifeName)}"></label>`,
    `<h1>Your working week</h1><p class="muted">The planner keeps growth tasks out of working hours.</p>
     <label class="f">Usual office days</label><div class="chips" id="obOffice">${[1, 2, 3, 4, 5].map(d => `<button class="chip" data-a="lgChip" data-d="${d}" aria-pressed="${o.officeDays.includes(d)}">${DOW[d]}</button>`).join('')}</div>
     <div class="field-row"><label class="f">Work starts<input type="time" id="obWs" value="${o.workStart}"></label><label class="f">Work ends<input type="time" id="obWe" value="${o.workEnd}"></label></div>
     <label class="f">Commute each way on office days (minutes)<input type="number" inputmode="numeric" id="obCommute" value="${o.commute}"></label>`,
    `<h1>Your rhythm</h1><p class="muted">These become protected commitments.</p>
     <div class="field-row"><label class="f">Wake<input type="time" id="obWake" value="${o.wake}"></label><label class="f">Bedtime target<input type="time" id="obBed" value="${o.bedtime}"></label></div>
     <div class="field-row"><label class="f">Bible study day${daySel('obBibleDay', o.bibleDay)}</label><label class="f">Starts<input type="time" id="obBibleTime" value="${o.bibleTime}"></label></div>
     <label class="f">Sunday church (keyboard) starts<input type="time" id="obChurch" value="${o.churchTime}"></label>
     <label class="f">Date night${daySel('obDate', o.dateNight)}</label>`,
    `<h1>Starter goals</h1><p class="muted">Sensible starting points for ${cycleFor(yearStart()).label}, each with quarterly milestones. Nothing is marked as achieved. Untick anything that doesn't fit and edit the rest later.</p>
     <div class="stack-sm" id="obGoals">${PILLARS.map(p => `<span class="eyebrow">${esc(p.name)}</span><div class="list">${STARTER_GOALS.filter(g => g.pillar === p.id).map(g => `<label class="task"><input type="checkbox" class="switch" data-k="${g.key}" ${OB.goals.includes(g.key) ? 'checked' : ''}><span class="grow small">${esc(g.title)}</span></label>`).join('')}</div>`).join('')}</div>`,
    `<h1>Privacy and data</h1>
     <div class="callout">Everything is saved on this phone as you go. You can download backups any time, and turn on encrypted cloud backup and Notion sync in More.</div>
     <div class="callout">This is a personal app. Don't enter DVS case details, client information or government documents. Keep learning notes general.</div>
     <button class="btn block" data-a="setPin">${ICON.lock} Set a PIN (optional)</button>`,
  ];
  document.body.innerHTML = `<div id="app" class="ob"><div class="stack"><div class="wordmark">One Life OS</div><div class="steps">${steps.map((_, i) => `<i class="${i <= s ? 'on' : ''}"></i>`).join('')}</div>${steps[s]}
    <div class="row" style="margin-top:8px">${s ? '<button class="btn block" data-a="obBack">Back</button>' : ''}<button class="btn primary block" data-a="obNext">${s === steps.length - 1 ? 'Start my plan' : 'Continue'}</button></div></div></div>`;
}
A.obNext = () => { obRead(); if (OB.step < 4) { OB.step++; renderOnboarding(); scrollTo(0, 0); return; } finishOnboarding(); };
A.obBack = () => { obRead(); OB.step--; renderOnboarding(); };
async function finishOnboarding() {
  seedFromOnboarding(OB.o, OB.goals);
  try { navigator.storage && navigator.storage.persist && await navigator.storage.persist(); } catch (e) { }
  await flush();
  startApp();
  toast('Your plan is ready');
}

/* ===================== Boot ===================== */
function startApp() {
  shell(); applyTheme(); R.date = null; go('today');
  setTimeout(autoJobs, 2500);
}
async function boot() {
  await loadAll();
  applyTheme();
  if (memoryOnly) document.title = 'ONE LIFE OS (not saving)';
  if (!S.settings.onboarded) { renderOnboarding(); return; }
  if (S.settings.pinHash) { document.body.innerHTML = ''; await showLock(); }
  startApp();
  if (memoryOnly) toast('Storage is blocked in this browser, so changes will not be saved.');
}
let lastDay = today();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && S.settings.onboarded && $('#view')) {
    if (today() !== lastDay) { lastDay = today(); if (!R.sub) { R.date = null; render(); } }
  }
});
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').then(reg => {
    reg.addEventListener('updatefound', () => { const w = reg.installing; w && w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) { toast('Update ready. Reopen the app to use it.'); } }); });
  }).catch(() => { });
}
boot();

</script>
